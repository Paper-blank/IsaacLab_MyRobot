version: 2
description: Direction calibration from the recorded exoskeleton channels to the Isaac Lab articulation frame.
coordinate_calibration:
  # Motion order is right-leg then left-leg.  The signs are data -> raw USD
  # articulation signs inferred from the mirrored hip/knee axes: right hip +,
  # right knee -, left hip -, left knee +.  Validate these signs with a
  # single-joint +/-0.5 rad Kit trial before using a new recording site.
  joint_sign: [1, 1, -1, 1, 1, -1, 1, 1]
  # IMU-01/03/05 are left-leg sensors and IMU-02/04/06 are right-leg sensors.
  # Matrix rows are output (joint) axes and
  # columns are input (dataset) axes: output = matrix @ dataset_vector.
  imu_sensor_sides: [left, right, left, right, left, right]
  # Right: joint_x=dataset_y, joint_y=dataset_x, joint_z=-dataset_z.
  # Left: joint_x=-dataset_y, joint_y=dataset_x, joint_z=-dataset_z.
  imu_axis_transforms:
    right: [[0, 1, 0], [1, 0, 0], [0, 0, -1]]
    left: [[0, -1, 0], [1, 0, 0], [0, 0, -1]]
  # Explicit frame chain for each retained sensor:
  # R_exo = R_joint_link @ R_link_sensor @ R_sensor_IMU.
  # The supplied CSV/URDF files do not contain measured mounting poses, so
  # the two physical mounting rotations remain identity until calibrated.
  R_joint_link:
    default: [[1, 0, 0], [0, 1, 0], [0, 0, 1]]
  R_link_sensor:
    default: [[1, 0, 0], [0, 1, 0], [0, 0, 1]]
  orientation_mode: euler_components
  # These signs are used only by old callers that do not pass a sensor index.
  imu_orientation_sign: [1, -1, 1]
  imu_gyro_sign: [-1, -1, 1]
  imu_accel_sign: [-1, -1, 1]
