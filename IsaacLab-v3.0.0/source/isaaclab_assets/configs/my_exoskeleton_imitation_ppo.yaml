# rl_games PPO for Isaac-MyExoskeleton-Imitation-v0.
# Camera/event observations are compact GPU features (not 256x256 tensors),
# which keeps the 4096-environment rollout within a practical memory budget.
seed: 42
params:
  seed: 42
  algo:
    name: a2c_continuous
  model:
    name: continuous_a2c_logstd
  env:
    clip_observations: 100.0
    clip_actions: 1.0
    obs_groups:
      obs: [policy, imu, camera_rgb, event_camera]
      states: [critic]
    concate_obs_groups: true
  network:
    name: actor_critic
    separate: false
    space:
      continuous:
        mu_activation: None
        sigma_activation: None
        mu_init:
          name: default
        sigma_init:
          name: const_initializer
          val: -0.22314355
        fixed_sigma: true
    mlp:
      units: [256, 256]
      activation: elu
      d2rl: false
      initializer:
        name: default
      regularizer:
        name: None
    rnn:
      name: lstm
      units: 128
      layers: 1
      before_mlp: true
      concat_input: true
      layer_norm: false
  config:
    name: my_exoskeleton_imitation_ppo
    env_name: rlgpu
    device: 'cuda:0'
    device_name: 'cuda:0'
    multi_gpu: false
    ppo: true
    use_experimental_cv: false
    value_bootstrap: true
    reward_shaper:
      scale_value: 1.0
    normalize_advantage: true
    lr_schedule: adaptive
    schedule_type: standard
    kl_threshold: 0.01
    score_to_win: 100000
    save_best_after: 100
    save_frequency: 200
    print_stats: true
    critic_coef: 2.0
    bounds_loss_coef: 0.0001
    normalize_input: true
    normalize_value: true
    num_actors: 4096
    horizon_length: 32
    minibatch_size: 512
    seq_length: 16
    zero_rnn_on_done: true
    mini_epochs: 5
    learning_rate: 3.0e-4
    gamma: 0.99
    tau: 0.95
    e_clip: 0.2
    entropy_coef: 0.01
    clip_value: true
    truncate_grads: true
    grad_norm: 1.0
    max_epochs: 30000
    central_value_config:
      minibatch_size: 512
      mini_epochs: 5
      learning_rate: 3.0e-4
      lr_schedule: adaptive
      kl_threshold: 0.01
      clip_value: true
      normalize_input: true
      truncate_grads: true
      network:
        name: actor_critic
        central_value: true
        mlp:
          units: [256, 256]
          activation: elu
          d2rl: false
          initializer:
            name: default
          regularizer:
            name: None
