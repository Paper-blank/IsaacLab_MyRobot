# Paper-inspired recurrent PPO for the 49-D gait-conditioned actor and the
# 62-D privileged critic. The action dimension remains eight.
seed: 42
params:
  seed: 42
  algo:
    name: a2c_continuous
  model:
    name: continuous_a2c_logstd
  env:
    clip_observations: 100.0
    clip_actions: 1.0
    obs_groups:
      obs: [policy]
      states: [critic]
  network:
    name: actor_critic
    separate: False
    space:
      continuous:
        mu_activation: None
        sigma_activation: None
        mu_init:
          name: default
        sigma_init:
          name: const_initializer
          # continuous_a2c_logstd exponentiates this value: exp(log(0.8)) = 0.8.
          val: -0.22314355
        fixed_sigma: True
    mlp:
      units: [32]
      activation: elu
      d2rl: False
      initializer:
        name: default
      regularizer:
        name: None
    rnn:
      name: lstm
      units: 64
      layers: 1
      before_mlp: True
      concat_input: True
      layer_norm: False
  config:
    name: my_exoskeleton_ppo
    # Registered by Isaac Lab's RL-Games backend.
    env_name: rlgpu
    device: 'cuda:0'
    device_name: 'cuda:0'
    multi_gpu: False
    ppo: True
    use_experimental_cv: False
    value_bootstrap: True
    reward_shaper:
      scale_value: 1.0
    normalize_advantage: True
    lr_schedule: adaptive
    schedule_type: standard
    kl_threshold: 0.01
    score_to_win: 100000
    save_best_after: 100
    save_frequency: 200
    print_stats: True
    critic_coef: 2.0
    bounds_loss_coef: 0.0001
    normalize_input: True
    normalize_value: True
    num_actors: 4096
    horizon_length: 32
    # 32-step rollouts make this divide both the 16-env smoke-test batch
    # (16 * 32) and the 4096-env production batch (4096 * 32).
    minibatch_size: 512
    seq_length: 16
    zero_rnn_on_done: True
    mini_epochs: 5
    learning_rate: 3.0e-4
    gamma: 0.99
    tau: 0.95
    e_clip: 0.2
    entropy_coef: 0.01
    clip_value: True
    truncate_grads: True
    grad_norm: 1.0
    max_epochs: 30000
    central_value_config:
      minibatch_size: 512
      mini_epochs: 5
      learning_rate: 3.0e-4
      lr_schedule: adaptive
      kl_threshold: 0.01
      clip_value: True
      normalize_input: True
      truncate_grads: True
      network:
        name: actor_critic
        central_value: True
        mlp:
          units: [32]
          activation: elu
          d2rl: False
          initializer:
            name: default
          regularizer:
            name: None
